{% extends 'base.html' %}

{% block title %}Delete Channel | GamingTube{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body text-center">
                    <h3>Are you sure?</h3>
                    <p class="lead">You are about to delete the channel:</p>
                    <h4 class="text-danger">{{ object.name }}</h4>
                    
                    <p class="text-muted">This action cannot be undone.</p>
                    
                    <form method="POST">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger btn-lg">Yes, Delete Channel</button>
                        <a href="{% url 'channel_detail' object.pk %}" class="btn btn-secondary btn-lg">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
