{% extends 'base.html' %}

{% block title %}Add Channel | GamingTube{% endblock %}

{% block content %}
<h1>Add Your Channel</h1>
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}   <!-- or {{ form }} if you want full control -->
    <button type="submit" class="btn btn-primary">Add</button>
    <a href="{% url 'channel_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
