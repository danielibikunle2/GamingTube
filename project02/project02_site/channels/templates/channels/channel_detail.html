{% extends 'base.html' %}

{% block title %}{{ channel.name }} | GamingTube{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        {% if channel.banner %}
        <img src="{{ channel.banner.url }}" class="img-fluid mb-4" alt="{{ channel.name }}">
        {% endif %}
        <h1>{{ channel.name }}</h1>
        <p class="text-muted">{{ channel.subscriber_count }} subscribers</p>
        <p>{{ channel.description }}</p>
        <p class="text-muted">Added by: {{ channel.owner.username }}</p>
    </div>
</div>
{% endblock %}
